<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Colour Matcher">
<meta name="theme-color" content="#e9eaec">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Colour Matcher</title>
<style>
:root{--bg:#e9eaec;--ink:#1d1f22;--mute:#6b7076;--card:#f7f8f9;--line:#cfd2d6;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#17181a;--ink:#eceef0;--mute:#9aa0a6;--card:#222427;--line:#33363a}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 ui-rounded,"SF Pro Rounded",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:6px 0 14px}
h2{font-size:19px;margin:0 0 4px}
h3{font-size:14px;font-weight:600;color:var(--mute);margin:18px 0 8px}
#stage{position:relative;border-radius:16px;overflow:hidden;background:#000;min-height:220px}
video,canvas{display:block;width:100%;height:auto}
#dot{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #000;pointer-events:none}
#hint{color:var(--mute);margin:10px 2px}
.bar{display:flex;gap:10px;margin:10px 0 4px}
button{flex:1;padding:15px;font:inherit;font-weight:700;border:0;border-radius:14px;background:var(--ink);color:var(--bg)}
#pair{display:flex;gap:12px;margin-top:18px}
#pair>div{flex:1;min-width:0}
.big{height:96px;border-radius:14px;border:1px solid var(--line)}
.small{color:var(--mute);font-size:13px;margin:6px 0 0}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.s{flex:1 1 70px;min-width:0;padding:6px;border-radius:12px;background:var(--card);border:2px solid transparent}
.s.me{border-color:var(--ink)}
.s i{display:block;height:70px;border-radius:8px;border:1px solid var(--line)}
.s b{display:block;font-size:13px;margin-top:6px;overflow-wrap:anywhere}
.s span{font-size:12px;color:var(--mute)}
footer{color:var(--mute);font-size:12px;margin:28px 2px 8px}
</style>
</head>
<body>
<main>
<h1>Colour Matcher</h1>
<div id="stage">
  <video id="v" playsinline muted autoplay></video>
  <canvas id="c" hidden></canvas>
  <div id="dot" hidden></div>
</div>
<p id="hint"></p>
<div class="bar">
  <button id="snap">Take photo</button>
  <button id="retake" hidden>Retake photo</button>
</div>
<section id="out" hidden>
  <div id="pair"></div>
  <div id="combos"></div>
</section>
<footer>Colour combinations from Wada Sanzo's <i>A Dictionary of Color Combinations</i>, data via sanzo-wada.dmbk.io.</footer>
</main>
<script>
const $ = id => document.getElementById(id);
let colours = [], combos = {}, stream = null;

function rgb2lab(r, g, b) {
  [r, g, b] = [r, g, b].map(v => { v /= 255; return v > 0.04045 ? Math.pow((v + 0.055) / 1.055, 2.4) : v / 12.92; });
  let x = (r * 0.4124564 + g * 0.3575761 + b * 0.1804375) / 0.95047;
  let y = r * 0.2126729 + g * 0.7151522 + b * 0.0721750;
  let z = (r * 0.0193339 + g * 0.1191920 + b * 0.9503041) / 1.08883;
  const f = t => t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
  x = f(x); y = f(y); z = f(z);
  return [116 * y - 16, 500 * (x - y), 200 * (y - z)];
}

function de2000(p, q) {
  const [L1, a1, b1] = p, [L2, a2, b2] = q, rad = Math.PI / 180, deg = 180 / Math.PI;
  const C1 = Math.hypot(a1, b1), C2 = Math.hypot(a2, b2), Cm = (C1 + C2) / 2;
  const G = 0.5 * (1 - Math.sqrt(Math.pow(Cm, 7) / (Math.pow(Cm, 7) + Math.pow(25, 7))));
  const a1p = (1 + G) * a1, a2p = (1 + G) * a2;
  const C1p = Math.hypot(a1p, b1), C2p = Math.hypot(a2p, b2);
  const h1p = (Math.atan2(b1, a1p) * deg + 360) % 360, h2p = (Math.atan2(b2, a2p) * deg + 360) % 360;
  const dLp = L2 - L1, dCp = C2p - C1p;
  let dhp = 0;
  if (C1p * C2p !== 0) { dhp = h2p - h1p; if (dhp > 180) dhp -= 360; else if (dhp < -180) dhp += 360; }
  const dHp = 2 * Math.sqrt(C1p * C2p) * Math.sin(dhp * rad / 2);
  const Lpm = (L1 + L2) / 2, Cpm = (C1p + C2p) / 2;
  let hpm = h1p + h2p;
  if (C1p * C2p !== 0) {
    hpm = Math.abs(h1p - h2p) <= 180 ? (h1p + h2p) / 2 : (h1p + h2p + (h1p + h2p < 360 ? 360 : -360)) / 2;
  }
  const T = 1 - 0.17 * Math.cos((hpm - 30) * rad) + 0.24 * Math.cos(2 * hpm * rad) + 0.32 * Math.cos((3 * hpm + 6) * rad) - 0.20 * Math.cos((4 * hpm - 63) * rad);
  const dTheta = 30 * Math.exp(-Math.pow((hpm - 275) / 25, 2));
  const Rc = 2 * Math.sqrt(Math.pow(Cpm, 7) / (Math.pow(Cpm, 7) + Math.pow(25, 7)));
  const Sl = 1 + 0.015 * Math.pow(Lpm - 50, 2) / Math.sqrt(20 + Math.pow(Lpm - 50, 2));
  const Sc = 1 + 0.045 * Cpm, Sh = 1 + 0.015 * Cpm * T;
  const Rt = -Math.sin(2 * dTheta * rad) * Rc;
  return Math.sqrt(Math.pow(dLp / Sl, 2) + Math.pow(dCp / Sc, 2) + Math.pow(dHp / Sh, 2) + Rt * (dCp / Sc) * (dHp / Sh));
}

const toHex = rgb => '#' + rgb.map(v => v.toString(16).padStart(2, '0')).join('');
const hint = t => { $('hint').textContent = t; };

async function startCam() {
  $('out').hidden = true; $('c').hidden = true; $('dot').hidden = true;
  $('v').hidden = false; $('snap').hidden = false; $('retake').hidden = true;
  hint('Point the camera at something, then tap Take photo.');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    $('v').srcObject = stream;
  } catch (e) {
    hint('The camera could not start (' + e.message + '). Allow camera access for this site in Settings, then reload.');
  }
}

function stopCam() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}

$('snap').onclick = () => {
  const v = $('v'), c = $('c');
  if (!v.videoWidth) { hint('The camera is still starting. Try again in a moment.'); return; }
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  stopCam();
  v.hidden = true; c.hidden = false; $('snap').hidden = true; $('retake').hidden = false;
  hint('Tap anywhere on the photo to pick a colour.');
};

$('retake').onclick = startCam;

$('c').addEventListener('click', e => {
  const c = $('c'), r = c.getBoundingClientRect();
  const x = Math.round((e.clientX - r.left) * c.width / r.width);
  const y = Math.round((e.clientY - r.top) * c.height / r.height);
  const n = 4, x0 = Math.max(0, x - n), y0 = Math.max(0, y - n);
  const w = Math.min(c.width - x0, 2 * n + 1), h = Math.min(c.height - y0, 2 * n + 1);
  const d = c.getContext('2d').getImageData(x0, y0, w, h).data;
  const k = d.length / 4;
  let R = 0, G = 0, B = 0;
  for (let i = 0; i < d.length; i += 4) { R += d[i]; G += d[i + 1]; B += d[i + 2]; }
  $('dot').style.left = (e.clientX - r.left) + 'px';
  $('dot').style.top = (e.clientY - r.top) + 'px';
  $('dot').hidden = false;
  show([R, G, B].map(s => Math.round(s / k)));
});

function show(rgb) {
  if (!colours.length) { hint('The colour data has not loaded. Check your connection and reload.'); return; }
  const lab = rgb2lab(...rgb);
  let best = null, bd = Infinity;
  colours.forEach(c => { const d = de2000(lab, c.lab); if (d < bd) { bd = d; best = c; } });
  hint('Tap another spot to pick a different colour.');
  $('pair').innerHTML =
    '<div><div class="big" style="background:' + toHex(rgb) + '"></div><h2>You picked</h2><p class="small">' + toHex(rgb) + '</p></div>' +
    '<div><div class="big" style="background:' + best.hex + '"></div><h2>' + best.name + '</h2><p class="small">' + best.hex + ' · distance ' + bd.toFixed(1) + ' (lower is closer)</p></div>';
  const rows = best.combos.slice().sort((a, b) => a - b)
    .map(id => ({ id, list: combos[id] })).filter(r => r.list.length > 1);
  $('combos').innerHTML = rows.length
    ? rows.map(r => '<h3>Combination ' + r.id + '</h3><div class="sw">' +
        r.list.map(c => '<div class="s' + (c === best ? ' me' : '') + '"><i style="background:' + c.hex + '"></i><b>' + c.name + '</b><span>' + c.hex + '</span></div>').join('') +
        '</div>').join('')
    : '<h3>No combinations are listed for ' + best.name + ' in the book.</h3>';
  $('out').hidden = false;
  $('out').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function init() {
  try {
    const d = await (await fetch('colours.json')).json();
    colours = d.colors.map(c => ({ name: c.name, hex: c.hex, combos: c.combinations, lab: rgb2lab(...c.rgb_array) }));
    colours.forEach(c => c.combos.forEach(id => (combos[id] = combos[id] || []).push(c)));
  } catch (e) { /* reported when a colour is picked */ }
  startCam();
}

init();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
