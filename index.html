<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Colour Combinations">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Colour Combinations</title>
<style>
:root{--bg:#e9eaec;--ink:#1d1f22;--mute:#6b7076;--card:#f7f8f9;--line:#cfd2d6;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#17181a;--ink:#eceef0;--mute:#9aa0a6;--card:#222427;--line:#33363a}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 ui-rounded,"SF Pro Rounded",system-ui,sans-serif}
button{font:inherit;border:0;padding:0;background:none;color:inherit;cursor:pointer}
#cam{height:100vh;height:100dvh;background:#000;color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#top{text-align:center;font-size:15px;font-weight:600;padding:10px 0 8px}
#stage{position:relative;flex:1;min-height:0;margin:0 6px;border-radius:18px;overflow:hidden;background:#111;display:flex;align-items:center;justify-content:center}
video{display:block;width:100%;height:100%;object-fit:cover}
#c{display:block;max-width:100%;max-height:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#dot{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #000;pointer-events:none}
#close{position:absolute;top:10px;left:10px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:18px}
#cam:not(.photo) #close{display:none}
#zoom{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:4px;border-radius:999px;background:rgba(0,0,0,.45)}
#zoom button{min-width:38px;height:38px;padding:0 9px;border-radius:999px;color:#fff;font-size:13px;font-weight:600}
#zoom button.on{background:rgba(255,255,255,.92);color:#000}
#cam.photo #zoom{display:none}
#hint{margin:8px 16px 0;min-height:18px;text-align:center;font-size:13px;color:#b9bec4}
#controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 28px calc(18px + env(safe-area-inset-bottom))}
#lib{justify-self:start;width:46px;height:46px;border-radius:10px;border:2px solid #fff;background:#222 center/cover no-repeat;display:flex;align-items:center;justify-content:center}
#snap{width:76px;height:76px;border-radius:50%;border:4px solid #fff;padding:4px}
#snap::after{content:"";display:block;width:100%;height:100%;border-radius:50%;background:#fff}
#snap:active::after{transform:scale(.9)}
#flip{justify-self:end;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
#cam.photo #snap,#cam.photo #flip{visibility:hidden}
#loupe{position:fixed;z-index:10;width:120px;height:120px;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.35);pointer-events:none}
#lc{display:block;width:100%;height:100%}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
main{max-width:560px;margin:0 auto;padding:4px 16px calc(16px + env(safe-area-inset-bottom))}
h2{font-size:19px;margin:0 0 4px}
h3{font-size:14px;font-weight:600;color:var(--mute);margin:18px 0 8px}
#pair{display:flex;gap:12px;margin-top:18px}
#pair>div{flex:1;min-width:0}
#match{cursor:pointer}
.big{height:96px;border-radius:14px;border:1px solid var(--line)}
.small{color:var(--mute);font-size:13px;margin:6px 0 0}
.near{display:flex;gap:8px;padding:2px 2px 6px}
.near button{flex:1 1 0;min-width:0;padding:6px;background:var(--card);color:var(--ink);border:2px solid transparent;border-radius:12px;text-align:left}
.near button.on{border-color:var(--ink)}
.near i{display:block;height:44px;border-radius:8px;border:1px solid var(--line)}
.near b{display:block;font-size:12px;font-weight:600;margin-top:4px;line-height:1.2}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.s{flex:1 1 70px;min-width:0;padding:6px;border-radius:12px;background:var(--card);border:2px solid transparent}
.s.me{border-color:var(--ink)}
.s i{display:block;height:70px;border-radius:8px;border:1px solid var(--line)}
.s b{display:block;font-size:13px;margin-top:6px;overflow-wrap:anywhere}
.s span{font-size:12px;color:var(--mute)}
footer{color:var(--mute);font-size:12px;margin:28px 2px 8px}
</style>
</head>
<body>
<section id="cam">
  <div id="top">Colour Combinations</div>
  <div id="stage">
    <video id="v" playsinline muted autoplay></video>
    <canvas id="c" hidden></canvas>
    <div id="dot" hidden></div>
    <button id="close" aria-label="Back to camera">✕</button>
    <div id="zoom" hidden></div>
  </div>
  <p id="hint"></p>
  <div id="controls">
    <label id="lib" for="file" aria-label="Choose a photo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></label>
    <button id="snap" aria-label="Take photo"></button>
    <button id="flip" aria-label="Flip camera"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.9-3.9L4 9"/><path d="M4 4v5h5"/><path d="M4 13a8 8 0 0 0 14.9 3.9L20 15"/><path d="M20 20v-5h-5"/></svg></button>
  </div>
</section>
<div id="loupe" hidden><canvas id="lc"></canvas></div>
<input type="file" id="file" accept="image/*" class="vh">
<main>
<section id="out" hidden>
  <div id="pair"></div>
  <div id="nearBox" hidden>
    <h3>Close matches (tap one to swap)</h3>
    <div id="near" class="near"></div>
  </div>
  <div id="combos"></div>
</section>
<footer>Colour combinations from Wada Sanzo's <i>A Dictionary of Color Combinations</i>, data via sanzo-wada.dmbk.io.</footer>
</main>
<script>
const $ = id => document.getElementById(id);
let colours = [], combos = {}, stream = null, near = [], pickedRgb = null, facing = 'environment', lenses = [], lensId = null;

function rgb2lab(r, g, b) {
  [r, g, b] = [r, g, b].map(v => { v /= 255; return v > 0.04045 ? Math.pow((v + 0.055) / 1.055, 2.4) : v / 12.92; });
  let x = (r * 0.4124564 + g * 0.3575761 + b * 0.1804375) / 0.95047;
  let y = r * 0.2126729 + g * 0.7151522 + b * 0.0721750;
  let z = (r * 0.0193339 + g * 0.1191920 + b * 0.9503041) / 1.08883;
  const f = t => t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
  x = f(x); y = f(y); z = f(z);
  return [116 * y - 16, 500 * (x - y), 200 * (y - z)];
}

function de2000(p, q) {
  const [L1, a1, b1] = p, [L2, a2, b2] = q, rad = Math.PI / 180, deg = 180 / Math.PI;
  const C1 = Math.hypot(a1, b1), C2 = Math.hypot(a2, b2), Cm = (C1 + C2) / 2;
  const G = 0.5 * (1 - Math.sqrt(Math.pow(Cm, 7) / (Math.pow(Cm, 7) + Math.pow(25, 7))));
  const a1p = (1 + G) * a1, a2p = (1 + G) * a2;
  const C1p = Math.hypot(a1p, b1), C2p = Math.hypot(a2p, b2);
  const h1p = (Math.atan2(b1, a1p) * deg + 360) % 360, h2p = (Math.atan2(b2, a2p) * deg + 360) % 360;
  const dLp = L2 - L1, dCp = C2p - C1p;
  let dhp = 0;
  if (C1p * C2p !== 0) { dhp = h2p - h1p; if (dhp > 180) dhp -= 360; else if (dhp < -180) dhp += 360; }
  const dHp = 2 * Math.sqrt(C1p * C2p) * Math.sin(dhp * rad / 2);
  const Lpm = (L1 + L2) / 2, Cpm = (C1p + C2p) / 2;
  let hpm = h1p + h2p;
  if (C1p * C2p !== 0) {
    hpm = Math.abs(h1p - h2p) <= 180 ? (h1p + h2p) / 2 : (h1p + h2p + (h1p + h2p < 360 ? 360 : -360)) / 2;
  }
  const T = 1 - 0.17 * Math.cos((hpm - 30) * rad) + 0.24 * Math.cos(2 * hpm * rad) + 0.32 * Math.cos((3 * hpm + 6) * rad) - 0.20 * Math.cos((4 * hpm - 63) * rad);
  const dTheta = 30 * Math.exp(-Math.pow((hpm - 275) / 25, 2));
  const Rc = 2 * Math.sqrt(Math.pow(Cpm, 7) / (Math.pow(Cpm, 7) + Math.pow(25, 7)));
  const Sl = 1 + 0.015 * Math.pow(Lpm - 50, 2) / Math.sqrt(20 + Math.pow(Lpm - 50, 2));
  const Sc = 1 + 0.045 * Cpm, Sh = 1 + 0.015 * Cpm * T;
  const Rt = -Math.sin(2 * dTheta * rad) * Rc;
  return Math.sqrt(Math.pow(dLp / Sl, 2) + Math.pow(dCp / Sc, 2) + Math.pow(dHp / Sh, 2) + Rt * (dCp / Sc) * (dHp / Sh));
}

const toHex = rgb => '#' + rgb.map(v => v.toString(16).padStart(2, '0')).join('');
const hint = t => { $('hint').textContent = t; };
const inPhoto = () => $('cam').classList.contains('photo');

async function startCam() {
  stopCam();
  $('cam').classList.remove('photo');
  $('out').hidden = true; $('c').hidden = true; $('dot').hidden = true; $('v').hidden = false;
  hint('');
  $('zoom').hidden = true;
  const video = facing === 'environment' && lensId ? { deviceId: { exact: lensId } } : { facingMode: { ideal: facing } };
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video, audio: false });
    if (inPhoto()) { stopCam(); return; }
    const v = $('v');
    v.muted = true;
    v.setAttribute('playsinline', '');
    v.srcObject = stream;
    await v.play();
    await findLenses();
    drawZoom();
  } catch (e) {
    if (lensId) { lensId = null; return startCam(); }
    hint('The camera could not start. Allow camera access for this site in Settings, then reopen the app.');
  }
}

async function findLenses() {
  if (lenses.length) return;
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  const plain = d => !/dual|triple|front/i.test(d.label);
  const uw = devs.find(d => plain(d) && /ultra ?wide/i.test(d.label));
  const tele = devs.find(d => plain(d) && /telephoto/i.test(d.label));
  const wide = devs.find(d => plain(d) && /back/i.test(d.label) && !/ultra|tele/i.test(d.label));
  lenses = [[uw, '.5'], [wide, '1×'], [tele, 'Tele']].filter(l => l[0]).map(([d, text]) => ({ id: d.deviceId, text }));
  if (lenses.length < 2) lenses = [];
}

function drawZoom() {
  const z = $('zoom');
  if (facing !== 'environment' || !lenses.length) { z.hidden = true; return; }
  const cur = (stream && stream.getVideoTracks()[0].getSettings().deviceId) || lensId;
  z.innerHTML = lenses.map(l => '<button data-id="' + l.id + '" class="' + (l.id === cur ? 'on' : '') + '">' + l.text + '</button>').join('');
  z.hidden = false;
}

$('zoom').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) { lensId = b.dataset.id; startCam(); }
});

function stopCam() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}

function photoMode() {
  $('cam').classList.add('photo');
  $('v').hidden = true; $('c').hidden = false; $('dot').hidden = true; $('out').hidden = true;
  hint('Drag over the photo and let go on the colour you want.');
}

$('snap').onclick = () => {
  const v = $('v'), c = $('c');
  if (!v.videoWidth) { hint('The camera is still starting. Try again in a moment.'); return; }
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  stopCam();
  photoMode();
};

$('flip').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; startCam(); };
$('close').onclick = () => { window.scrollTo(0, 0); startCam(); };
$('v').addEventListener('click', startCam);

$('file').addEventListener('change', e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  const url = URL.createObjectURL(f), img = new Image();
  img.onload = () => {
    const c = $('c'), s = Math.min(1, 4032 / Math.max(img.naturalWidth, img.naturalHeight));
    c.width = Math.round(img.naturalWidth * s);
    c.height = Math.round(img.naturalHeight * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const t = document.createElement('canvas'), m = Math.min(img.naturalWidth, img.naturalHeight);
    t.width = t.height = 96;
    t.getContext('2d').drawImage(img, (img.naturalWidth - m) / 2, (img.naturalHeight - m) / 2, m, m, 0, 0, 96, 96);
    $('lib').style.backgroundImage = 'url(' + t.toDataURL('image/jpeg', 0.8) + ')';
    $('lib').innerHTML = '';
    URL.revokeObjectURL(url);
    stopCam();
    photoMode();
  };
  img.onerror = () => { URL.revokeObjectURL(url); hint('That photo could not be opened. Try a different one.'); };
  img.src = url;
});

const loupe = $('loupe'), lc = $('lc'), lx = lc.getContext('2d'), LS = 120;
lc.width = lc.height = LS * (window.devicePixelRatio || 1);
let dragging = false;

function toSource(e) {
  const c = $('c'), r = c.getBoundingClientRect();
  const x = Math.min(c.width - 1, Math.max(0, Math.round((e.clientX - r.left) * c.width / r.width)));
  const y = Math.min(c.height - 1, Math.max(0, Math.round((e.clientY - r.top) * c.height / r.height)));
  return { c, r, x, y };
}

function moveLoupe(e) {
  const { c, x, y } = toSource(e);
  let top = e.clientY - 60 - LS;
  if (top < 8) top = e.clientY + 60;
  const left = Math.min(Math.max(e.clientX - LS / 2, 8), window.innerWidth - LS - 8);
  loupe.style.left = left + 'px';
  loupe.style.top = top + 'px';
  const N = 15, h = (N - 1) / 2, sx = x - h, sy = y - h, z = lc.width / N;
  lx.imageSmoothingEnabled = false;
  lx.fillStyle = '#000';
  lx.fillRect(0, 0, lc.width, lc.height);
  const ix = Math.max(0, sx), iy = Math.max(0, sy);
  const ix2 = Math.min(c.width, sx + N), iy2 = Math.min(c.height, sy + N);
  if (ix2 > ix && iy2 > iy) lx.drawImage(c, ix, iy, ix2 - ix, iy2 - iy, (ix - sx) * z, (iy - sy) * z, (ix2 - ix) * z, (iy2 - iy) * z);
  lx.strokeStyle = 'rgba(0,0,0,.18)';
  lx.lineWidth = 1;
  lx.beginPath();
  for (let i = 1; i < N; i++) { lx.moveTo(i * z, 0); lx.lineTo(i * z, lc.height); lx.moveTo(0, i * z); lx.lineTo(lc.width, i * z); }
  lx.stroke();
  const p = h * z, t = lc.width * 0.02;
  lx.lineWidth = t * 2; lx.strokeStyle = '#000'; lx.strokeRect(p, p, z, z);
  lx.lineWidth = t; lx.strokeStyle = '#fff'; lx.strokeRect(p, p, z, z);
}

function pick(e) {
  const { c, r, x, y } = toSource(e);
  const d = c.getContext('2d').getImageData(x, y, 1, 1).data;
  $('dot').style.left = (c.offsetLeft + x * r.width / c.width) + 'px';
  $('dot').style.top = (c.offsetTop + y * r.height / c.height) + 'px';
  $('dot').hidden = false;
  show([d[0], d[1], d[2]]);
}

const cv = $('c');
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  dragging = true;
  cv.setPointerCapture(e.pointerId);
  $('dot').hidden = true;
  loupe.hidden = false;
  moveLoupe(e);
});
cv.addEventListener('pointermove', e => { if (dragging) moveLoupe(e); });
cv.addEventListener('pointerup', e => {
  if (!dragging) return;
  dragging = false;
  loupe.hidden = true;
  pick(e);
});
cv.addEventListener('pointercancel', () => { dragging = false; loupe.hidden = true; });

function show(rgb) {
  if (!colours.length) { hint('The colour data has not loaded. Check your connection and reopen the app.'); return; }
  const lab = rgb2lab(...rgb);
  near = colours.map(c => ({ c, d: de2000(lab, c.lab) })).sort((a, b) => a.d - b.d).slice(0, 5);
  pickedRgb = rgb;
  $('nearBox').hidden = true;
  render(0);
  $('out').hidden = false;
  hint('Drag again to pick another colour.');
  $('out').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function render(i) {
  const best = near[i].c, bd = near[i].d, rgb = pickedRgb;
  $('near').innerHTML = near.map((n, j) => '<button class="' + (j === i ? 'on' : '') + '" data-i="' + j + '"><i style="background:' + n.c.hex + '"></i><b>' + n.c.name + '</b></button>').join('');
  $('pair').innerHTML =
    '<div><div class="big" style="background:' + toHex(rgb) + '"></div><h2>You picked</h2><p class="small">' + toHex(rgb) + '</p></div>' +
    '<div id="match" role="button"><div class="big" style="background:' + best.hex + '"></div><h2>' + best.name + '</h2><p class="small">' + best.hex + ' · distance ' + bd.toFixed(1) + '</p><p class="small">Tap to see close matches</p></div>';
  const rows = best.combos.slice().sort((a, b) => a - b)
    .map(id => ({ id, list: combos[id] })).filter(r => r.list.length > 1);
  $('combos').innerHTML = rows.length
    ? rows.map(r => '<h3>Combination ' + r.id + '</h3><div class="sw">' +
        r.list.map(c => '<div class="s' + (c === best ? ' me' : '') + '"><i style="background:' + c.hex + '"></i><b>' + c.name + '</b><span>' + c.hex + '</span></div>').join('') +
        '</div>').join('')
    : '<h3>No combinations are listed for ' + best.name + ' in the book.</h3>';
}

$('pair').addEventListener('click', e => {
  if (e.target.closest('#match')) $('nearBox').hidden = !$('nearBox').hidden;
});
$('near').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) render(+b.dataset.i);
});

async function init() {
  try {
    const d = await (await fetch('colours.json')).json();
    colours = d.colors.map(c => ({ name: c.name, hex: c.hex, combos: c.combinations, lab: rgb2lab(...c.rgb_array) }));
    colours.forEach(c => c.combos.forEach(id => (combos[id] = combos[id] || []).push(c)));
  } catch (e) { /* reported when a colour is picked */ }
  startCam();
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !inPhoto()) startCam();
});
window.addEventListener('pageshow', e => { if (e.persisted && !inPhoto()) startCam(); });

init();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
